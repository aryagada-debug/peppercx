<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pepper — Customer Pulse</title>
<style>
  :root{
    --ink:#15131f;
    --muted:#6b6878;
    --line:#e7e4ef;
    --bg:#faf9fc;
    --card:#ffffff;
    --brand:#5b3df5;
    --brand-2:#8b6cff;
    --brand-soft:#efeaff;
    --good:#1d9d6c;
    --warn:#e0922f;
    --bad:#d8413c;
    --shadow:0 10px 40px rgba(38,28,80,.10);
    --r:16px;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#f4f1fc 0%,var(--bg) 280px);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
  }
  .wrap{max-width:680px;margin:0 auto;padding:32px 20px 80px}
  /* header */
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-2));
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;box-shadow:var(--shadow)}
  .brand b{font-size:16px;letter-spacing:.2px}
  .brand span{color:var(--muted);font-size:13px;margin-left:2px}
  /* progress */
  .progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:6px}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand-2));
    border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1)}
  .stepmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:18px}
  /* card */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
    padding:28px 26px;animation:rise .45s cubic-bezier(.2,.7,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--brand);margin-bottom:8px}
  h1{font-size:25px;margin:0 0 8px;letter-spacing:-.3px}
  .lede{color:var(--muted);font-size:15px;margin:0 0 22px}
  .q{margin:0 0 26px}
  .q:last-child{margin-bottom:6px}
  .q > label.qt{display:block;font-weight:650;font-size:15.5px;margin-bottom:4px}
  .q .hint{color:var(--muted);font-size:13px;margin:0 0 12px}
  .req{color:var(--bad);margin-left:3px}
  /* role cards */
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .role{border:1.5px solid var(--line);border-radius:14px;padding:18px 16px;cursor:pointer;transition:.18s;background:#fff}
  .role:hover{border-color:var(--brand-2);transform:translateY(-2px)}
  .role.sel{border-color:var(--brand);background:var(--brand-soft)}
  .role .ic{font-size:22px;margin-bottom:8px}
  .role b{display:block;font-size:15px;margin-bottom:3px}
  .role small{color:var(--muted);font-size:12.5px;line-height:1.35;display:block}
  @media(max-width:520px){.roles{grid-template-columns:1fr}}
  /* NPS scale */
  .nps{display:flex;gap:6px;flex-wrap:wrap}
  .nps button{flex:1;min-width:38px;height:46px;border:1.5px solid var(--line);background:#fff;border-radius:10px;
    font-size:15px;font-weight:650;cursor:pointer;color:var(--ink);transition:.15s}
  .nps button:hover{border-color:var(--brand-2)}
  .nps button.sel{color:#fff;border-color:transparent;transform:translateY(-2px);box-shadow:var(--shadow)}
  .nps button.sel[data-band="det"]{background:var(--bad)}
  .nps button.sel[data-band="pas"]{background:var(--warn)}
  .nps button.sel[data-band="pro"]{background:var(--good)}
  .npsends{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:7px}
  /* rating rows (CSAT/CES) */
  .scale{display:flex;gap:7px;flex-wrap:wrap}
  .scale button{min-width:42px;height:42px;padding:0 12px;border:1.5px solid var(--line);background:#fff;border-radius:10px;
    font-size:14px;font-weight:600;cursor:pointer;color:var(--ink);transition:.15s}
  .scale button:hover{border-color:var(--brand-2)}
  .scale button.sel{background:var(--brand);color:#fff;border-color:transparent;box-shadow:var(--shadow)}
  .scale.compact button{min-width:0;flex:1}
  /* star matrix */
  .matrix{border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .mrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:0}
  .mrow .mlabel{font-size:14px;font-weight:550}
  .mrow .mlabel small{display:block;color:var(--muted);font-weight:400;font-size:12px}
  .stars{display:flex;gap:3px;flex-shrink:0}
  .stars span{font-size:23px;color:#d9d5e6;cursor:pointer;transition:.12s;line-height:1}
  .stars span:hover,.stars span.on{color:#f5b400}
  .stars span:hover{transform:scale(1.12)}
  .na{font-size:12px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
  .na input{margin-right:4px;vertical-align:middle}
  /* choice chips / radio */
  .choices{display:flex;flex-direction:column;gap:9px}
  .choices.grid{flex-direction:row;flex-wrap:wrap}
  .choice{border:1.5px solid var(--line);border-radius:11px;padding:12px 15px;cursor:pointer;font-size:14.5px;
    display:flex;align-items:center;gap:10px;transition:.15s;background:#fff}
  .choices.grid .choice{flex:1;min-width:120px;justify-content:center}
  .choice:hover{border-color:var(--brand-2)}
  .choice.sel{border-color:var(--brand);background:var(--brand-soft)}
  .choice .dot{width:17px;height:17px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;transition:.15s}
  .choice.sel .dot{border-color:var(--brand);background:var(--brand);box-shadow:inset 0 0 0 3px #fff}
  .choice.multi .dot{border-radius:5px}
  /* textarea + input */
  textarea,input[type=text],input[type=email]{width:100%;border:1.5px solid var(--line);border-radius:11px;
    padding:12px 14px;font-size:14.5px;font-family:inherit;color:var(--ink);resize:vertical;background:#fff;transition:.15s}
  textarea:focus,input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  textarea{min-height:92px}
  .cnt{text-align:right;font-size:11.5px;color:var(--muted);margin-top:4px}
  /* conditional reveal */
  .reveal{max-height:0;overflow:hidden;opacity:0;transition:max-height .4s ease,opacity .3s ease,margin .3s ease;margin-top:0}
  .reveal.open{max-height:420px;opacity:1;margin-top:14px}
  /* nav */
  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:26px}
  .btn{border:0;border-radius:12px;padding:13px 26px;font-size:14.5px;font-weight:650;cursor:pointer;transition:.18s}
  .btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;box-shadow:var(--shadow)}
  .btn-primary:hover{transform:translateY(-2px)}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-ghost{background:transparent;color:var(--muted)}
  .btn-ghost:hover{color:var(--ink)}
  .err{color:var(--bad);font-size:13px;margin-top:12px;display:none}
  .err.show{display:block}
  /* summary */
  .done .big{font-size:54px;text-align:center;margin:4px 0 8px}
  .scorecard{display:flex;gap:10px;margin:18px 0 4px;flex-wrap:wrap}
  .metric{flex:1;min-width:120px;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;background:var(--bg)}
  .metric b{display:block;font-size:26px;line-height:1.1}
  .metric small{color:var(--muted);font-size:12px}
  pre.out{background:#15131f;color:#d8d2f5;border-radius:12px;padding:16px;font-size:12px;overflow:auto;max-height:260px;
    white-space:pre-wrap;word-break:break-word}
  .copybar{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
  .pill{display:inline-block;background:var(--brand-soft);color:var(--brand);font-size:12px;font-weight:600;
    padding:3px 10px;border-radius:99px;margin-bottom:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="logo">P</div>
    <div><b>Pepper</b><span>Customer Pulse</span></div>
  </div>

  <div class="progress"><i id="bar"></i></div>
  <div class="stepmeta"><span id="stepName">Welcome</span><span id="stepNum"></span></div>

  <div id="stage"></div>

  <div class="foot">Your answers go straight to the Pepper Customer Success team. Takes about 4–5 minutes.</div>
</div>

<script>
/* ============================================================
   CONFIG — paste your two URLs here, then save. That's it.
   1) FORMSPREE_ENDPOINT: create a form at formspree.io → copy the
      endpoint that looks like https://formspree.io/f/abcdwxyz
   2) SLACK_WEBHOOK: in Slack, add an "Incoming Webhook" app to the
      channel you want alerts in → copy the https://hooks.slack.com/... URL
   Leave either blank to disable it (form still works, shows copy/download).
   ============================================================ */
const SUPABASE_URL = 'https://gdklfxqbocvoxcfthysy.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdka2xmeHFib2N2b3hjZnRoeXN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQwNjE1OTMsImV4cCI6MjA4OTYzNzU5M30.rHinakkAMWIJ_5AdFLd65DXBWpUCHwM1Zty76y4z7x8';
const SURVEY_TOKEN = new URLSearchParams(location.search).get('t') || '';

/* ---------------- state ---------------- */
const A = {};            // all answers
let step = 0;
let _sent = false;

/* Prefill name/email/company from invite token. */
if (SURVEY_TOKEN) {
  fetch(`${SUPABASE_URL}/rest/v1/rpc/get_survey_invite_by_token`, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'apikey': SUPABASE_ANON,
      'Authorization': `Bearer ${SUPABASE_ANON}`,
    },
    body: JSON.stringify({ _token: SURVEY_TOKEN }),
  }).then(r => r.json()).then(rows => {
    const row = Array.isArray(rows) ? rows[0] : null;
    if (!row) return;
    if (row.completed) {
      const w = document.querySelector('.wrap');
      if (w) w.innerHTML = '<div class="card"><h1>You\'ve already responded</h1><p class="lede">Thank you — we\'ve recorded your earlier response. Reach out to centralcx@peppercontent.io if you\'d like to update it.</p></div>';
      return;
    }
    A.name = row.recipient_name || '';
    A.email = row.recipient_email || '';
    A.company = row.account_snapshot || '';
    // Mark opened (best-effort).
    fetch(`${SUPABASE_URL}/functions/v1/survey-submit`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_ANON,
        'Authorization': `Bearer ${SUPABASE_ANON}`,
      },
      body: JSON.stringify({ token: SURVEY_TOKEN, action: 'opened' }),
    }).catch(() => {});
  }).catch(() => {});
}

/* ---------------- helpers ---------------- */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const isUser = ()=> A.role==='user' || A.role==='both';
const isBuyer = ()=> A.role==='buyer' || A.role==='both';

/* ---------------- step definitions ---------------- */
/* Each step returns {name, render(node), validate()} */
const steps = [];

/* 0 — Welcome / role */
steps.push({
  name:'Welcome',
  render(n){
    n.append(el('div','pill','We actually read every response'));
    n.append(el('h1',null,'Tell us how it’s really going.'));
    n.append(el('p','lede','A few honest minutes from you shapes what we build, fix, and prioritise next. No fluff — we want the real picture.'));
    const q = el('div','q');
    q.append(el('label','qt','First, which best describes your role with Pepper?<span class="req">*</span>'));
    const roles = el('div','roles');
    [['buyer','🧭','Decision-maker / sponsor','I own the budget, contract or the call to renew'],
     ['user','⚙️','Day-to-day user','I work hands-on with Pepper or the deliverables'],
     ['both','🎯','A bit of both','I use it and I influence the renewal']
    ].forEach(([v,ic,t,d])=>{
      const c = el('div','role'+(A.role===v?' sel':''));
      c.innerHTML = `<div class="ic">${ic}</div><b>${t}</b><small>${d}</small>`;
      c.onclick=()=>{A.role=v; render();};
      roles.append(c);
    });
    q.append(roles);
    n.append(q);
  },
  validate:()=> A.role ? true : 'Please pick the option that fits you best.'
});

/* 1 — Capabilities used */
steps.push({
  name:'What you use',
  render(n){
    n.append(el('div','eyebrow','Your Pepper mix'));
    n.append(el('h1',null,'Which Pepper capabilities do you work with?'));
    n.append(el('p','lede','Pick all that apply — we’ll tailor the next questions to what you actually use.'));
    A.caps=A.caps||[];
    const opts=[
      ['content','📝','Pepper Content','Articles, blogs, website & B2B full-funnel content, localisation, CRM / lifecycle'],
      ['seo','🔍','Pepper SEO / GEO','SEO + content retainers, AI Search (GEO) visibility, content + SEO hubs'],
      ['creative','🎨','Pepper Creative','Social, video, influencer campaigns, design & campaign assets'],
      ['studios','🧩','Content Studios','Embedded talent, onsite or virtual, working inside your team'],
    ];
    const box=el('div','choices');
    opts.forEach(([v,ic,t,d])=>{
      const on=A.caps.includes(v);
      const c=el('div','choice multi'+(on?' sel':''));
      c.style.alignItems='flex-start';
      c.innerHTML=`<span class="dot" style="margin-top:3px"></span><span><b style="font-size:15px">${ic} ${t}</b><br><small style="color:var(--muted)">${d}</small></span>`;
      c.onclick=()=>{ on?A.caps=A.caps.filter(x=>x!==v):A.caps.push(v); render(); };
      box.append(c);
    });
    n.append(box);
  },
  validate:()=> (A.caps&&A.caps.length) ? true : 'Pick at least one capability you work with.'
});

/* 2 — NPS */
steps.push({
  name:'Recommendation',
  render(n){
    n.append(el('div','eyebrow','The big one'));
    n.append(el('h1',null,'How likely are you to recommend Pepper to a peer or colleague?'));
    n.append(el('p','lede','0 = not a chance · 10 = already have'));
    const q=el('div','q');
    const nps=el('div','nps');
    for(let i=0;i<=10;i++){
      const band = i<=6?'det':(i<=8?'pas':'pro');
      const b=el('button',(A.nps===i?'sel':''),i);
      b.dataset.band=band;
      b.onclick=()=>{A.nps=i; render();};
      nps.append(b);
    }
    q.append(nps);
    q.append(el('div','npsends','<span>Not likely</span><span>Extremely likely</span>'));
    n.append(q);

    // dynamic follow-up
    if(A.nps!=null){
      const fu=el('div','q');
      let prompt = A.nps<=6
        ? 'What’s the main reason for that score — what would need to change?'
        : A.nps<=8
          ? 'What’s holding you back from a 9 or 10?'
          : 'Brilliant. What do you love most — and would you say it in a quote we could use?';
      fu.append(el('label','qt',prompt));
      fu.append(textarea('npsWhy'));
      n.append(fu);
    }
  },
  validate:()=> A.nps!=null ? true : 'Slide a number — even a tough one is useful.'
});

/* 2 — Value & ROI (retention core) */
steps.push({
  name:'Value',
  render(n){
    n.append(el('div','eyebrow','Value realised'));
    n.append(el('h1',null,'Are you getting what you came for?'));
    n.append(el('p','lede','This tells us whether Pepper is genuinely paying off for you.'));

    n.append(scale('value','How much value are you getting from Pepper today, relative to what you pay?',
      ['Far less than I pay','Less','Fair','More','Far more value than I pay'],true));

    n.append(scale('goals','Is Pepper helping you hit the goals you signed up for?',
      ['Not at all','Slightly','Somewhat','Mostly','Completely'],true));

    if(isBuyer()){
      const q=el('div','q');
      q.append(el('label','qt','In one line — what business outcome are you hoping Pepper drives this year?'));
      q.append(el('p','hint','e.g. “pipeline from organic”, “content cost down 30%”, “rank for AI search”'));
      q.append(input('outcome','text'));
      n.append(q);
    }
  },
  validate:()=> (A.value!=null && A.goals!=null) ? true : 'Pick a point on both scales above.'
});

/* 4 — Capability deep-dive (branches by A.caps) */
steps.push({
  name:'Deep dive',
  render(n){
    n.append(el('div','eyebrow','Where it really matters'));
    n.append(el('h1',null,'Let’s get specific about outcomes.'));
    n.append(el('p','lede','A few targeted questions on the capabilities you use. This is where the real signal lives.'));
    const caps=A.caps||[];
    if(caps.includes('content')) capContent(n);
    if(caps.includes('seo'))     capSEO(n);
    if(caps.includes('creative'))capCreative(n);
    if(caps.includes('studios')) capStudios(n);
  },
  validate(){
    const caps=A.caps||[];
    if(caps.includes('seo')){
      if(!A.seo_primaryOutcome||!A.seo_primaryOutcome.length) return 'For SEO/GEO, tell us which outcomes matter most to you.';
      if(A.seo_trafficGrowth==null) return 'Let us know if you’re seeing organic growth.';
      if(A.seo_geoVisible==null) return 'Tell us how visible you are in AI Search answers.';
    }
    if(caps.includes('content') && A.content_drivesOutcome==null) return 'Rate whether the content is driving outcomes.';
    if(caps.includes('creative') && A.creative_performs==null) return 'Rate how the creative is performing.';
    if(caps.includes('studios') && A.studios_talentFit==null) return 'Rate the talent fit.';
    return true;
  }
});

function capHeader(n,ic,title){
  const h=el('div');h.style.cssText='display:flex;align-items:center;gap:9px;margin:6px 0 14px;padding-top:18px;border-top:1px solid var(--line)';
  h.innerHTML=`<span style="font-size:20px">${ic}</span><b style="font-size:16px">${title}</b>`;
  n.append(h);
}
function capContent(n){
  capHeader(n,'📝','Pepper Content');
  n.append(scale('content_drivesOutcome','Is the content actually driving the outcomes you publish it for?',
    ['Not at all','Slightly','Somewhat','Mostly','Absolutely'],true));
  n.append(multi('content_outcomes','What do you most need this content to do? (pick up to 2-3)',[
    ['authority','Build brand authority / thought leadership'],
    ['traffic','Grow organic traffic'],
    ['pipeline','Generate leads / pipeline'],
    ['enable','Enable sales / nurture'],
    ['rank','Rank & support SEO'],
    ['scale','Scale output reliably'],
  ]));
  n.append(scale('content_brief','How consistently does the work land on-brief and publish-ready the first time?',
    ['Rarely','','Sometimes','','Almost always'],true));
}
function capSEO(n){
  capHeader(n,'🔍','Pepper SEO / GEO — outcomes');

  n.append(multi('seo_primaryOutcome','What does SEO/GEO success look like for you? (pick what matters)',[
    ['traffic','Organic traffic growth'],
    ['pipeline','Leads / pipeline from organic'],
    ['geo','AI Search visibility (ChatGPT, Perplexity, AI Overviews)'],
    ['rankings','Keyword rankings'],
    ['sov','Share of voice vs competitors'],
  ]));

  n.append(scale('seo_trafficGrowth','Are you seeing measurable organic growth with us?',
    ['Declining','Flat','Slight lift','Solid growth','Strong, compounding'],true));

  // GEO signal — the one that matters most
  const g=el('div');g.style.cssText='background:var(--brand-soft);border-radius:12px;padding:16px;margin:8px 0 22px';
  g.append(el('div','eyebrow','GEO · AI Search'));
  const gq=el('div','q');gq.style.margin='0';
  gq.append(el('label','qt','When buyers ask AI tools (ChatGPT, Perplexity, AI Overviews) about your space, how often does your brand show up?'));
  const s1=el('div','scale compact');
  ['Never','Rarely','Sometimes','Often','Consistently cited'].forEach((lab,i)=>{
    const v=i+1;const b=el('button',(A.seo_geoVisible===v?'sel':''),lab);
    b.onclick=()=>{A.seo_geoVisible=v;render();};s1.append(b);
  });
  gq.append(s1);g.append(gq);
  n.append(g);

  n.append(scale('seo_toPipeline','Is organic translating into pipeline / revenue, not just traffic?',
    ['Not at all','A little','Somewhat','Clearly','It’s a primary channel'],true));

  const fu=el('div','q');fu.style.marginTop='20px';
  fu.append(el('label','qt','The single SEO/GEO outcome that would make this an undeniable win?'));
  fu.append(el('p','hint','e.g. “cited by ChatGPT for our buying queries”, “30% of pipeline from organic”'));
  fu.append(textarea('seo_winOutcome'));
  n.append(fu);
}
function capCreative(n){
  capHeader(n,'🎨','Pepper Creative');
  n.append(scale('creative_quality','How strong and on-brand is the creative we deliver?',
    ['Off the mark','','Okay','','Excellent'],true));
  n.append(scale('creative_performs','Is the creative actually performing — engagement, reach, conversions?',
    ['Not at all','Slightly','Somewhat','Well','Driving real results'],true));
  n.append(scale('creative_speed','How’s our turnaround speed on creative?',
    ['Too slow','','Acceptable','','Fast'],true));
}
function capStudios(n){
  capHeader(n,'🧩','Content Studios');
  n.append(scale('studios_talentFit','How well does the embedded talent fit your needs and standards?',
    ['Poor fit','','Okay','','Perfect fit'],true));
  n.append(scale('studios_integration','How well do they integrate with your team and ways of working?',
    ['Siloed','','Okay','','Fully embedded'],true));
  n.append(scale('studios_ramp','How much do you have to manage them day-to-day?',
    ['Constant oversight','','Some','','Fully self-driven'],true));
}

/* 5 — Experience / CSAT matrix */
steps.push({
  name:'Experience',
  render(n){
    n.append(el('div','eyebrow','Your experience'));
    n.append(el('h1',null,'Rate how we’re doing where it counts.'));
    n.append(el('p','lede','Tap the stars. Skip anything that doesn’t apply to you.'));

    const rows = [
      ['quality','Quality of the work / deliverables','Does the output meet your bar?'],
      ['support','Support & responsiveness','How we show up when you need us'],
      ['comms','Communication & updates','Do you always know where things stand?'],
      ['speed','Speed & turnaround','Do things move at the pace you need?'],
    ];
    if(isUser()) rows.push(['ease','Ease of working with the platform/team','How smooth is the day-to-day?']);
    if(isBuyer()) rows.push(['partner','Feeling like a strategic partner','Are we proactive, not just reactive?']);

    A._ratings = A._ratings || {};
    const m = el('div','matrix');
    rows.forEach(([k,t,d])=>{
      const row=el('div','mrow');
      const lab=el('div','mlabel',`${t}<small>${d}</small>`);
      const right=el('div',null);right.style.cssText='display:flex;align-items:center;gap:14px';
      const stars=el('div','stars');
      for(let i=1;i<=5;i++){
        const s=el('span',(A._ratings[k]>=i?'on':''),'★');
        s.onclick=()=>{A._ratings[k]=i; A['na_'+k]=false; render();};
        stars.append(s);
      }
      const na=el('label','na',`<input type="checkbox" ${A['na_'+k]?'checked':''}/>N/A`);
      na.querySelector('input').onchange=e=>{A['na_'+k]=e.target.checked; if(e.target.checked)delete A._ratings[k]; render();};
      right.append(stars);right.append(na);
      row.append(lab);row.append(right);
      m.append(row);
    });
    n.append(m);

    // surface the weakest area for a targeted follow-up
    const rated = Object.entries(A._ratings);
    const low = rated.filter(([k,v])=>v<=3).sort((a,b)=>a[1]-b[1])[0];
    const fu=el('div','q');fu.style.marginTop='20px';
    fu.append(el('label','qt', low
      ? 'You rated something a little lower — what happened there?'
      : 'Anything specific we got really right, or could do better?'));
    fu.append(textarea('expWhy'));
    n.append(fu);
  },
  validate:()=> (A._ratings && Object.keys(A._ratings).length) ? true : 'Rate at least one area (or mark them N/A).'
});

/* 4 — Effort (CES) */
steps.push({
  name:'Effort',
  render(n){
    n.append(el('div','eyebrow','How easy are we to work with'));
    n.append(el('h1',null,'“Pepper makes it easy to get what I need.”'));
    n.append(el('p','lede','How much do you agree?'));
    n.append(scale('ces',null,['Strongly disagree','Disagree','Neutral','Agree','Strongly agree'],true));

    const q=el('div','q');q.style.marginTop='20px';
    q.append(el('label','qt','Where do you lose the most time or friction with us, if anywhere?'));
    q.append(textarea('friction'));
    n.append(q);
  },
  validate:()=> A.ces!=null ? true : 'Pick where you land on the scale.'
});

/* 5 — Retention: renewal intent */
steps.push({
  name:'Renewal',
  render(n){
    n.append(el('div','eyebrow','Looking ahead'));
    n.append(el('h1',null,'If renewal were today, where’s your head?'));
    n.append(el('p','lede','Straight talk helps us fix things before it matters.'));

    n.append(choices('renew','How likely are you to continue with Pepper?',[
      ['def','Definitely staying'],
      ['prob','Probably staying'],
      ['unsure','On the fence'],
      ['risk','Leaning towards leaving'],
      ['gone','Likely leaving'],
    ],true));

    // risk follow-up
    const atRisk = ['unsure','risk','gone'].includes(A.renew);
    const r=el('div','reveal'+(atRisk?' open':''));
    r.append(el('label','qt','What’s the one thing that would change your mind?'));
    r.append(textarea('saveWhy'));
    n.append(r);
  },
  validate:()=> A.renew ? true : 'Pick the option closest to how you feel.'
});

/* 6 — Expansion */
steps.push({
  name:'Growth',
  render(n){
    n.append(el('div','eyebrow','Doing more together'));
    n.append(el('h1',null,'Where could Pepper do more for you?'));
    n.append(el('p','lede','Pick anything that sounds useful — no commitment, just signal.'));

    n.append(multi('expand',null,[
      ['volume','More volume / scale of what we do today'],
      ['services','New services or content types'],
      ['seats','More seats / teams onboard'],
      ['strategy','Deeper strategy & advisory'],
      ['geo','AI Search / GEO optimisation'],
      ['none','Happy as-is for now'],
    ]));

    n.append(scale('referLikely','How open are you to introducing us to another team or company?',
      ['Not open','','Maybe','','Happy to'],true));

    const r=el('div','reveal'+(A.referLikely>=4?' open':''));
    r.append(el('label','qt','Lovely — who comes to mind? (optional, name or company)'));
    r.append(input('referWho','text'));
    n.append(r);
  },
  validate:()=> (A.expand && A.expand.length) ? true : 'Tick at least one (“Happy as-is” counts).'
});

/* 8 — Contact + consent */
steps.push({
  name:'Wrap up',
  render(n){
    n.append(el('div','eyebrow','Almost done'));
    n.append(el('h1',null,'Last bit.'));

    n.append(choices('mood','Honestly, how do you feel about Pepper right now?',[
      ['love','😍 Genuinely love it'],
      ['glad','🙂 Glad we work together'],
      ['neutral','😐 It’s fine'],
      ['frustrated','😕 A bit frustrated'],
      ['done','😤 Pretty fed up'],
    ],true));

    n.append(el('p','lede','Want us to follow up? Optional — leave blank to stay anonymous.'));

    const q=el('div','q');
    q.append(el('label','qt','Name'));
    q.append(input('name','text'));
    n.append(q);
    const q2=el('div','q');
    q2.append(el('label','qt','Work email'));
    q2.append(input('email','email'));
    n.append(q2);
    const q3=el('div','q');
    q3.append(el('label','qt','Company / account'));
    q3.append(input('company','text'));
    n.append(q3);

    n.append(choices('followup','Would you be open to a 15-min call to go deeper?',[
      ['yes','Yes, reach out'],
      ['maybe','Maybe, depends'],
      ['no','No thanks'],
    ],true));
  },
  validate:()=> A.mood ? true : 'One tap on how you feel and you’re done.'
});

/* ---------------- field builders ---------------- */
function textarea(key){
  const t=el('textarea');t.value=A[key]||'';t.maxLength=600;
  const c=el('div','cnt',(t.value.length)+'/600');
  t.oninput=()=>{A[key]=t.value;c.textContent=t.value.length+'/600';};
  const w=el('div');w.append(t);w.append(c);return w;
}
function input(key,type){
  const i=el('input');i.type=type;i.value=A[key]||'';
  i.oninput=()=>A[key]=i.value;return i;
}
function scale(key,label,labels,compact){
  const q=el('div','q');
  if(label)q.append(el('label','qt',label));
  const s=el('div','scale'+(compact?' compact':''));
  labels.forEach((lab,idx)=>{
    const v=idx+1;
    const b=el('button',(A[key]===v?'sel':''),lab||v);
    b.onclick=()=>{A[key]=v;render();};
    s.append(b);
  });
  q.append(s);
  return q;
}
function choices(key,label,opts,req){
  const q=el('div','q');
  if(label)q.append(el('label','qt',label+(req?'<span class="req">*</span>':'')));
  const box=el('div','choices');
  opts.forEach(([v,t])=>{
    const c=el('div','choice'+(A[key]===v?' sel':''));
    c.innerHTML=`<span class="dot"></span><span>${t}</span>`;
    c.onclick=()=>{A[key]=v;render();};
    box.append(c);
  });
  q.append(box);return q;
}
function multi(key,label,opts){
  A[key]=A[key]||[];
  const q=el('div','q');
  if(label)q.append(el('label','qt',label));
  const box=el('div','choices');
  opts.forEach(([v,t])=>{
    const on=A[key].includes(v);
    const c=el('div','choice multi'+(on?' sel':''));
    c.innerHTML=`<span class="dot"></span><span>${t}</span>`;
    c.onclick=()=>{
      if(v==='none'){A[key]=on?[]:['none'];}
      else{A[key]=A[key].filter(x=>x!=='none'); on?A[key]=A[key].filter(x=>x!==v):A[key].push(v);}
      render();
    };
    box.append(c);
  });
  q.append(box);return q;
}

/* ---------------- render engine ---------------- */
function render(){
  const stage=$('#stage');
  stage.innerHTML='';
  if(step>=steps.length){return renderDone();}
  const card=el('div','card');
  steps[step].render(card);

  const nav=el('div','nav');
  const back=el('button','btn btn-ghost','← Back');
  back.onclick=()=>{if(step>0){step--;render();}};
  back.style.visibility = step===0?'hidden':'visible';
  const next=el('button','btn btn-primary', step===steps.length-1?'Submit feedback':'Continue →');
  next.onclick=advance;
  nav.append(back);nav.append(next);
  card.append(nav);
  const err=el('div','err');err.id='err';card.append(err);

  stage.append(card);

  // progress
  $('#bar').style.width = ((step)/(steps.length))*100+'%';
  $('#stepName').textContent = steps[step].name;
  $('#stepNum').textContent = `Step ${step+1} of ${steps.length}`;
  window.scrollTo({top:0,behavior:'smooth'});
}
function advance(){
  const v=steps[step].validate();
  if(v!==true){const e=$('#err');e.textContent=v;e.classList.add('show');return;}
  step++;
  render();
}

/* ---------------- results ---------------- */
function npsCat(n){return n<=6?'Detractor':n<=8?'Passive':'Promoter';}
function renderDone(){
  $('#bar').style.width='100%';
  $('#stepName').textContent='Done';
  $('#stepNum').textContent='Thank you';
  const stage=$('#stage');stage.innerHTML='';
  const card=el('div','card done');
  card.append(el('div','big','🎉'));
  card.append(el('h1',null,'Thank you — truly.'));
  card.append(el('p','lede','This is exactly the kind of honesty that makes us better. Your Pepper team will see it today.'));

  // scorecard
  const sc=el('div','scorecard');
  sc.append(metric(A.nps!=null?A.nps:'—','NPS · '+(A.nps!=null?npsCat(A.nps):'—')));
  const csatVals=Object.values(A._ratings||{});
  const csat=csatVals.length?(csatVals.reduce((a,b)=>a+b,0)/csatVals.length).toFixed(1):'—';
  sc.append(metric(csat,'Avg experience / 5'));
  const moodMap={love:'😍',glad:'🙂',neutral:'😐',frustrated:'😕',done:'😤'};
  sc.append(metric(moodMap[A.mood]||'—','How you feel'));
  card.append(sc);

  // structured payload for the CS team
  const payload=buildPayload();

  // send to backend (Formspree) + Slack alert on HIGH churn risk
  const status=el('div');status.id='sendStatus';
  status.style.cssText='margin:8px 0 0;font-size:13.5px;font-weight:600;text-align:center';
  card.append(status);
  sendResponse(payload,status);

  card.append(el('p','lede','<br><b>For your Customer Success team</b> — structured response below. Copy or download it into your CRM / sheet.'));
  const pre=el('pre','out',JSON.stringify(payload,null,2));
  pre.id='payload';
  card.append(pre);

  const bar=el('div','copybar');
  const copy=el('button','btn btn-primary','Copy JSON');
  copy.onclick=()=>{navigator.clipboard.writeText(JSON.stringify(payload,null,2));copy.textContent='Copied ✓';setTimeout(()=>copy.textContent='Copy JSON',1500);};
  const dl=el('button','btn btn-ghost','Download .json');
  dl.onclick=()=>{const b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='pepper-feedback.json';a.click();URL.revokeObjectURL(u);};
  const again=el('button','btn btn-ghost','New response');
  again.onclick=()=>{for(const k in A)delete A[k];step=0;render();};
  bar.append(copy);bar.append(dl);bar.append(again);
  card.append(bar);

  stage.append(card);
  window.scrollTo({top:0,behavior:'smooth'});
}
function metric(val,label){const m=el('div','metric');m.innerHTML=`<b>${val}</b><small>${label}</small>`;return m;}
function buildPayload(){
  const riskScore = computeRisk();
  return {
    submitted_at:new Date().toISOString(),
    respondent:{role:A.role,name:A.name||null,email:A.email||null,company:A.company||null,capabilities:A.caps||[],wants_followup:A.followup||null},
    nps:{score:A.nps??null,category:A.nps!=null?npsCat(A.nps):null,verbatim:A.npsWhy||null},
    value:{value_for_money:A.value??null,goal_attainment:A.goals??null,target_outcome:A.outcome||null},
    capability_deep_dive:buildCapabilities(),
    experience:{ratings:A._ratings||{},avg:(()=>{const v=Object.values(A._ratings||{});return v.length?+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(2):null;})(),comment:A.expWhy||null},
    effort:{ces:A.ces??null,friction:A.friction||null},
    retention:{renewal_intent:A.renew||null,save_lever:A.saveWhy||null},
    expansion:{interests:A.expand||[],referral_openness:A.referLikely??null,referral_lead:A.referWho||null},
    sentiment:{mood:A.mood||null,one_change:A.wand||null,fan_for_life:A.fan||null},
    flags:{churn_risk:riskScore.level, reasons:riskScore.reasons, expansion_ready: (A.expand||[]).some(x=>x!=='none')&&['def','prob'].includes(A.renew)}
  };
}
/* ---------------- submission ---------------- */
async function sendResponse(payload,statusEl){
  if(_sent) return; _sent=true;
  if(statusEl){statusEl.style.color='var(--muted)';statusEl.textContent='Sending your response…';}
  let ok=false;
  try{
    const r=await fetch(`${SUPABASE_URL}/functions/v1/survey-submit`,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Accept':'application/json',
        'apikey': SUPABASE_ANON,
        'Authorization': `Bearer ${SUPABASE_ANON}`,
      },
      body:JSON.stringify({ token: SURVEY_TOKEN, payload })
    });
    ok=r.ok;
  }catch(e){ok=false;}
  if(statusEl){
    statusEl.style.color = ok?'var(--good)':'var(--bad)';
    statusEl.textContent = ok ? '✓ Response sent to your CS team' : '⚠ Could not auto-send — please copy or download below and share it.';
  }
}
function slackText(p){
  const r=p.respondent||{};
  const who=[r.name,r.company].filter(Boolean).join(' · ')||'Anonymous';
  const caps=(r.capabilities||[]).join(', ')||'—';
  const reasons=(p.flags&&p.flags.reasons||[]).join(', ')||'—';
  return `:rotating_light: *HIGH churn-risk feedback* — ${who}\n`+
    `*Capabilities:* ${caps}\n`+
    `*NPS:* ${p.nps.score??'—'} (${p.nps.category||'—'})  |  *Renewal:* ${p.retention.renewal_intent||'—'}  |  *Mood:* ${p.sentiment.mood||'—'}\n`+
    `*Why flagged:* ${reasons}\n`+
    (r.email?`*Contact:* ${r.email}  |  Follow-up: ${r.wants_followup||'—'}\n`:'')+
    (p.retention.save_lever?`*What would change their mind:* ${p.retention.save_lever}`:'');
}

function buildCapabilities(){
  const caps=A.caps||[];const out={};
  if(caps.includes('content')) out.content={
    drives_outcome:A.content_drivesOutcome??null, needed_outcomes:A.content_outcomes||[],
    on_brief:A.content_brief??null};
  if(caps.includes('seo')) out.seo_geo={
    success_metrics:A.seo_primaryOutcome||[], traffic_growth:A.seo_trafficGrowth??null,
    ai_citation_visibility:A.seo_geoVisible??null,
    organic_to_pipeline:A.seo_toPipeline??null, win_outcome:A.seo_winOutcome||null};
  if(caps.includes('creative')) out.creative={
    quality:A.creative_quality??null, performance:A.creative_performs??null,
    speed:A.creative_speed??null};
  if(caps.includes('studios')) out.studios={
    talent_fit:A.studios_talentFit??null, integration:A.studios_integration??null,
    autonomy:A.studios_ramp??null};
  return out;
}
function computeRisk(){
  let pts=0;const reasons=[];
  if(A.nps!=null&&A.nps<=6){pts+=2;reasons.push('Detractor NPS');}
  if(['unsure','risk','gone'].includes(A.renew)){pts+=3;reasons.push('Renewal at risk');}
  if(A.value!=null&&A.value<=2){pts+=2;reasons.push('Low value-for-money');}
  if(A.goals!=null&&A.goals<=2){pts+=2;reasons.push('Goals not met');}
  if(['frustrated','done'].includes(A.mood)){pts+=2;reasons.push('Negative sentiment');}
  if(A.ces!=null&&A.ces<=2){pts+=1;reasons.push('High effort');}
  // capability-specific outcome risk (esp. SEO/GEO)
  if((A.caps||[]).includes('seo')){
    if(A.seo_trafficGrowth!=null&&A.seo_trafficGrowth<=2){pts+=2;reasons.push('SEO: no organic growth');}
    if(A.seo_toPipeline!=null&&A.seo_toPipeline<=2){pts+=2;reasons.push('SEO: not converting to pipeline');}
    if(A.seo_reporting!=null&&A.seo_reporting<=2){pts+=1;reasons.push('SEO: weak outcome reporting');}
    if(A.seo_geoVisible!=null&&A.seo_geoVisible<=2){pts+=1;reasons.push('GEO: low AI Search visibility');}
  }
  if((A.caps||[]).includes('content')&&A.content_drivesOutcome!=null&&A.content_drivesOutcome<=2){pts+=1;reasons.push('Content not driving outcomes');}
  const level = pts>=5?'HIGH':pts>=2?'MEDIUM':'LOW';
  return {level,reasons};
}

render();
</script>
